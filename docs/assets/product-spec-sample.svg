  <g font-size="12.5" fill="#57606a">
    <text x="42" y="498">작성: 제품기획</text>
    <text x="322" y="498">검토: 임상운영팀</text>
    <text x="602" y="498">승인: 운영책임자</text>
    <text x="42" y="526">이 그림은 문서 설명용 예시 상품 설계서입니다.</text>
