    <rect x="120" y="302" width="330" height="30" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="450" y="302" width="200" height="30" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="650" y="302" width="220" height="30" fill="#ffffff" stroke="#d0d7de"/>
