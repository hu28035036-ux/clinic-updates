  <!-- Section 2 -->
  <rect x="30" y="344" width="840" height="28" fill="#eef4ff"/>
  <text x="42" y="364" font-size="15" font-weight="bold" fill="#1f6feb">2. 데이터 마이그레이션</text>
  <g font-size="12.5" fill="#24292f">
